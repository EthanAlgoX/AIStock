<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">4단계로 첫 보고서 만들기</title>
<desc id="desc">AI 모델 연결하기: 설정 → 모델 및 런타임에서 정보를 저장하고 연결을 테스트하세요. → 사용 가능한 기능 확인하기: 역량 센터에서 Skill, 도구와 데이터 가용성을 확인하세요. → 개별 종목 리서치 시작하기: 시장과 종목 코드를 입력하고 기본 계획을 확인한 뒤 실행하세요. → 저장된 보고서 읽기: 근거, 데이터 날짜, 위험과 누락된 정보를 확인하세요.</desc>
<rect width="960" height="660" rx="20" fill="#f8fafc" />
<g font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
<text x="40" y="57" font-size="32" font-weight="700" fill="#172b42">4단계로 첫 보고서 만들기</text>
<text x="40" y="91" font-size="20" fill="#516174">웹 화면을 연 다음 · 한 종목부터 시작하세요</text>
<rect x="40" y="120" width="880" height="108" rx="12" fill="white" stroke="#dce3ec" />
<rect x="56" y="144" width="60" height="60" rx="14" fill="#edf6f0" />
<text x="86" y="184" text-anchor="middle" font-size="27" font-weight="700" fill="#17624e">01</text>
<text x="140" y="161" font-size="26" font-weight="650" fill="#172b42">AI 모델 연결하기</text>
<text x="140" y="197" font-size="21" fill="#43566c">설정 → 모델 및 런타임에서 정보를 저장하고 연결을 테스트하세요.</text>
<path d="M86 231v13m-5-5 5 5 5-5" fill="none" stroke="#17624e" stroke-width="2" />
<rect x="40" y="248" width="880" height="108" rx="12" fill="white" stroke="#dce3ec" />
<rect x="56" y="272" width="60" height="60" rx="14" fill="#edf6f0" />
<text x="86" y="312" text-anchor="middle" font-size="27" font-weight="700" fill="#17624e">02</text>
<text x="140" y="289" font-size="26" font-weight="650" fill="#172b42">사용 가능한 기능 확인하기</text>
<text x="140" y="325" font-size="21" fill="#43566c">역량 센터에서 Skill, 도구와 데이터 가용성을 확인하세요.</text>
<path d="M86 359v13m-5-5 5 5 5-5" fill="none" stroke="#17624e" stroke-width="2" />
<rect x="40" y="376" width="880" height="108" rx="12" fill="white" stroke="#dce3ec" />
<rect x="56" y="400" width="60" height="60" rx="14" fill="#edf6f0" />
<text x="86" y="440" text-anchor="middle" font-size="27" font-weight="700" fill="#17624e">03</text>
<text x="140" y="417" font-size="26" font-weight="650" fill="#172b42">개별 종목 리서치 시작하기</text>
<text x="140" y="453" font-size="21" fill="#43566c">시장과 종목 코드를 입력하고 기본 계획을 확인한 뒤 실행하세요.</text>
<path d="M86 487v13m-5-5 5 5 5-5" fill="none" stroke="#17624e" stroke-width="2" />
<rect x="40" y="504" width="880" height="108" rx="12" fill="white" stroke="#dce3ec" />
<rect x="56" y="528" width="60" height="60" rx="14" fill="#edf6f0" />
<text x="86" y="568" text-anchor="middle" font-size="27" font-weight="700" fill="#17624e">04</text>
<text x="140" y="545" font-size="26" font-weight="650" fill="#172b42">저장된 보고서 읽기</text>
<text x="140" y="581" font-size="21" fill="#43566c">근거, 데이터 날짜, 위험과 누락된 정보를 확인하세요.</text>
<text x="920" y="638" text-anchor="end" font-size="16" fill="#516174">AI STOCK · 사용 흐름 안내이며 실제 화면 캡처가 아닙니다</text>
</g></svg>
