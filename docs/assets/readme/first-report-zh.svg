<rect x="56" y="272" width="60" height="60" rx="14" fill="#edf6f0"/>
<text x="86" y="312" text-anchor="middle" font-size="27" font-weight="700" fill="#17624e">02</text>
<text x="140" y="289" font-size="26" font-weight="650" fill="#172b42">检查可用能力</text>
<text x="140" y="325" font-size="21" fill="#43566c">能力中心：查看 Skill、工具，并检测所需数据源。</text>
