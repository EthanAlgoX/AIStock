<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
<title id="title">四步，生成第一份报告</title>
<desc id="desc">连接 AI 模型: 设置 → 模型与运行时：填写模型信息，保存并测试连接。 → 检查可用能力: 能力中心：查看 Skill、工具，并检测所需数据源。 → 发起个股研究: 选择市场、输入股票代码，检查默认方案后运行。 → 阅读已保存的报告: 检查依据、数据时间与风险，留意缺失信息和部分结果。</desc>
