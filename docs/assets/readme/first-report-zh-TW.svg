<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc" xml:lang="zh-TW">
<title id="title">四步，產生第一份報告</title>
<desc id="desc">連接 AI 模型: 設定 → 模型與執行時：填寫模型資訊，儲存並測試連線。 → 檢查可用能力: 能力中心：查看 Skill、工具，並檢測所需資料來源。 → 發起個股研究: 選擇市場、輸入股票代碼，檢查預設方案後執行。 → 閱讀已儲存的報告: 檢查依據、資料時間與風險，留意缺失資訊和部分結果。</desc>
<rect width="960" height="660" rx="20" fill="#f8fafc" />
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang TC, Microsoft JhengHei, sans-serif">
<text x="40" y="57" font-size="32" font-weight="700" fill="#172b42">四步，產生第一份報告</text>
<text x="40" y="91" font-size="20" fill="#516174">網站啟動後這樣操作 · 先從一隻股票開始</text>
<rect x="40" y="120" width="880" height="108" rx="12" fill="white" stroke="#dce3ec" />
<rect x="56" y="144" width="60" height="60" rx="14" fill="#edf6f0" />
<text x="86" y="184" text-anchor="middle" font-size="27" font-weight="700" fill="#17624e">01</text>
<text x="140" y="161" font-size="26" font-weight="650" fill="#172b42">連接 AI 模型</text>
<text x="140" y="197" font-size="21" fill="#43566c">設定 → 模型與執行時：填寫模型資訊，儲存並測試連線。</text>
<path d="M86 231v13m-5-5 5 5 5-5" fill="none" stroke="#17624e" stroke-width="2" />
<rect x="40" y="248" width="880" height="108" rx="12" fill="white" stroke="#dce3ec" />
<rect x="56" y="272" width="60" height="60" rx="14" fill="#edf6f0" />
<text x="86" y="312" text-anchor="middle" font-size="27" font-weight="700" fill="#17624e">02</text>
<text x="140" y="289" font-size="26" font-weight="650" fill="#172b42">檢查可用能力</text>
<text x="140" y="325" font-size="21" fill="#43566c">能力中心：查看 Skill、工具，並檢測所需資料來源。</text>
<path d="M86 359v13m-5-5 5 5 5-5" fill="none" stroke="#17624e" stroke-width="2" />
<rect x="40" y="376" width="880" height="108" rx="12" fill="white" stroke="#dce3ec" />
<rect x="56" y="400" width="60" height="60" rx="14" fill="#edf6f0" />
<text x="86" y="440" text-anchor="middle" font-size="27" font-weight="700" fill="#17624e">03</text>
<text x="140" y="417" font-size="26" font-weight="650" fill="#172b42">發起個股研究</text>
<text x="140" y="453" font-size="21" fill="#43566c">選擇市場、輸入股票代碼，檢查預設方案後執行。</text>
<path d="M86 487v13m-5-5 5 5 5-5" fill="none" stroke="#17624e" stroke-width="2" />
<rect x="40" y="504" width="880" height="108" rx="12" fill="white" stroke="#dce3ec" />
<rect x="56" y="528" width="60" height="60" rx="14" fill="#edf6f0" />
<text x="86" y="568" text-anchor="middle" font-size="27" font-weight="700" fill="#17624e">04</text>
<text x="140" y="545" font-size="26" font-weight="650" fill="#172b42">閱讀已儲存的報告</text>
<text x="140" y="581" font-size="21" fill="#43566c">檢查依據、資料時間與風險，留意缺失資訊和部分結果。</text>
<text x="920" y="638" text-anchor="end" font-size="16" fill="#516174">AI STOCK · 使用示意，非介面截圖</text>
</g></svg>
