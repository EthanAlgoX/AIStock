<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
<title id="title">从一个问题，到有依据的研究</title>
<desc id="desc">提出问题: 选择股票、填写研究目标，或给出筛选条件。 → 收集资料、计算指标: 获取可用的行情、新闻和基本面，调用工具计算指标。 → AI 按方法分析: Skill 提供分析方法，也可按需邀请多位 AI 专家讨论。 → 查看结果、继续研究: 回看已保存的依据与风险，或另外发起交易推演。</desc>
<rect width="960" height="660" rx="20" fill="#f8fafc"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<text x="40" y="57" font-size="32" font-weight="700" fill="#172b42">从一个问题，到有依据的研究</text>
<text x="40" y="91" font-size="20" fill="#516174">研究流程示意 · 实际输入取决于已接入的数据源</text>
<rect x="40" y="120" width="880" height="108" rx="12" fill="white" stroke="#dce3ec"/>
<rect x="56" y="144" width="60" height="60" rx="14" fill="#edf3fc"/>
<text x="86" y="184" text-anchor="middle" font-size="27" font-weight="700" fill="#2456a6">01</text>
<text x="140" y="161" font-size="26" font-weight="650" fill="#172b42">提出问题</text>
<text x="140" y="197" font-size="21" fill="#43566c">选择股票、填写研究目标，或给出筛选条件。</text>
<path d="M86 231v13m-5-5 5 5 5-5" fill="none" stroke="#2456a6" stroke-width="2"/>
<rect x="40" y="248" width="880" height="108" rx="12" fill="white" stroke="#dce3ec"/>
<rect x="56" y="272" width="60" height="60" rx="14" fill="#edf3fc"/>
<text x="86" y="312" text-anchor="middle" font-size="27" font-weight="700" fill="#2456a6">02</text>
<text x="140" y="289" font-size="26" font-weight="650" fill="#172b42">收集资料、计算指标</text>
<text x="140" y="325" font-size="21" fill="#43566c">获取可用的行情、新闻和基本面，调用工具计算指标。</text>
<path d="M86 359v13m-5-5 5 5 5-5" fill="none" stroke="#2456a6" stroke-width="2"/>
<rect x="40" y="376" width="880" height="108" rx="12" fill="white" stroke="#dce3ec"/>
<rect x="56" y="400" width="60" height="60" rx="14" fill="#edf3fc"/>
<text x="86" y="440" text-anchor="middle" font-size="27" font-weight="700" fill="#2456a6">03</text>
<text x="140" y="417" font-size="26" font-weight="650" fill="#172b42">AI 按方法分析</text>
<text x="140" y="453" font-size="21" fill="#43566c">Skill 提供分析方法，也可按需邀请多位 AI 专家讨论。</text>
<path d="M86 487v13m-5-5 5 5 5-5" fill="none" stroke="#2456a6" stroke-width="2"/>
<rect x="40" y="504" width="880" height="108" rx="12" fill="white" stroke="#dce3ec"/>
<rect x="56" y="528" width="60" height="60" rx="14" fill="#edf3fc"/>
<text x="86" y="568" text-anchor="middle" font-size="27" font-weight="700" fill="#2456a6">04</text>
<text x="140" y="545" font-size="26" font-weight="650" fill="#172b42">查看结果、继续研究</text>
<text x="140" y="581" font-size="21" fill="#43566c">回看已保存的依据与风险，或另外发起交易推演。</text>
<text x="920" y="638" text-anchor="end" font-size="16" fill="#516174">AI STOCK · 使用示意，非界面截图</text>
