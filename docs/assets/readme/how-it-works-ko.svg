<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">질문에서 근거 있는 리서치까지</title>
<desc id="desc">질문이나 종목 범위 정하기: 종목, 조사 목표 또는 선별 조건을 입력하세요. → 자료 수집과 지표 계산: 사용 가능한 시세, 뉴스와 기업 정보를 모으고 지표를 계산합니다. → AI가 선택한 방법으로 분석: Skill에 따라 분석하며, 필요하면 여러 AI 전문가가 참여합니다. → 결과를 읽고 조사 이어 가기: 저장된 근거와 위험을 확인하세요. 모의 거래는 별도로 시작합니다.</desc>
<rect width="960" height="660" rx="20" fill="#f8fafc" />
<g font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
<text x="40" y="57" font-size="32" font-weight="700" fill="#172b42">질문에서 근거 있는 리서치까지</text>
<text x="40" y="91" font-size="20" fill="#516174">리서치 흐름 · 실제 입력은 연결된 데이터 소스에 따라 달라집니다</text>
<rect x="40" y="120" width="880" height="108" rx="12" fill="white" stroke="#dce3ec" />
<rect x="56" y="144" width="60" height="60" rx="14" fill="#edf3fc" />
<text x="86" y="184" text-anchor="middle" font-size="27" font-weight="700" fill="#2456a6">01</text>
<text x="140" y="161" font-size="26" font-weight="650" fill="#172b42">질문이나 종목 범위 정하기</text>
<text x="140" y="197" font-size="21" fill="#43566c">종목, 조사 목표 또는 선별 조건을 입력하세요.</text>
<path d="M86 231v13m-5-5 5 5 5-5" fill="none" stroke="#2456a6" stroke-width="2" />
<rect x="40" y="248" width="880" height="108" rx="12" fill="white" stroke="#dce3ec" />
<rect x="56" y="272" width="60" height="60" rx="14" fill="#edf3fc" />
<text x="86" y="312" text-anchor="middle" font-size="27" font-weight="700" fill="#2456a6">02</text>
<text x="140" y="289" font-size="26" font-weight="650" fill="#172b42">자료 수집과 지표 계산</text>
<text x="140" y="325" font-size="21" fill="#43566c">사용 가능한 시세, 뉴스와 기업 정보를 모으고 지표를 계산합니다.</text>
<path d="M86 359v13m-5-5 5 5 5-5" fill="none" stroke="#2456a6" stroke-width="2" />
<rect x="40" y="376" width="880" height="108" rx="12" fill="white" stroke="#dce3ec" />
<rect x="56" y="400" width="60" height="60" rx="14" fill="#edf3fc" />
<text x="86" y="440" text-anchor="middle" font-size="27" font-weight="700" fill="#2456a6">03</text>
<text x="140" y="417" font-size="26" font-weight="650" fill="#172b42">AI가 선택한 방법으로 분석</text>
<text x="140" y="453" font-size="21" fill="#43566c">Skill에 따라 분석하며, 필요하면 여러 AI 전문가가 참여합니다.</text>
<path d="M86 487v13m-5-5 5 5 5-5" fill="none" stroke="#2456a6" stroke-width="2" />
<rect x="40" y="504" width="880" height="108" rx="12" fill="white" stroke="#dce3ec" />
<rect x="56" y="528" width="60" height="60" rx="14" fill="#edf3fc" />
<text x="86" y="568" text-anchor="middle" font-size="27" font-weight="700" fill="#2456a6">04</text>
<text x="140" y="545" font-size="26" font-weight="650" fill="#172b42">결과를 읽고 조사 이어 가기</text>
<text x="140" y="581" font-size="21" fill="#43566c">저장된 근거와 위험을 확인하세요. 모의 거래는 별도로 시작합니다.</text>
<text x="920" y="638" text-anchor="end" font-size="16" fill="#516174">AI STOCK · 사용 흐름 안내이며 실제 화면 캡처가 아닙니다</text>
</g></svg>
