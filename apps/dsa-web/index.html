<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/tradebot-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const storageKey = 'theme';
        const root = document.documentElement;
        const storedTheme = localStorage.getItem(storageKey);
        const theme = storedTheme === 'light' || storedTheme === 'dark'
          ? storedTheme
          : storedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        root.classList.remove('light', 'dark');
        root.classList.add(theme);
        root.style.colorScheme = theme;
      })();
    </script>
    <meta name="application-name" content="AI Stock" />
    <meta name="description" content="AI Stock — Connect market data, expert collaboration and AI-powered stock research." />
    <title>AI Stock</title>
  </head>
  <body>
    <!--
      THESIS: A research desk with one clear task canvas; repeated permanent sidebars yield to on-demand context.
      OWN-WORLD: NOFX-inspired warm paper and charcoal, vermilion actions, hairline dividers, readable sans-serif, tabular data, restrained corners.
      STORY: Orient in seven modules, choose a page, inspect evidence and state, then research, validate or track.
      FIRST VIEWPORT: A compact horizontal module header and local page strip frame a full-width workspace; history and capabilities open from its toolbar.
      FORM: User-pinned NOFX operational grammar; composition A from three visualized alternatives, chosen under delegated design authority.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
